<div class="login-container">
  <h2>Iniciar sesión</h2>

  <form (ngSubmit)="iniciarSesion()" autocomplete="off">
    <label for="correo">Correo</label>
    <input
      id="correo"
      name="correo"
      type="email"
      inputmode="email"
      [(ngModel)]="correo"
      [attr.maxlength]="maxCorreo + 1"
      autocomplete="username"
      autocapitalize="none"
    />

    <label for="password">Contraseña</label>
    <div class="campo-password">
      <input
        id="password"
        name="password"
        [type]="mostrar ? 'text' : 'password'"
        [(ngModel)]="password"
        [attr.maxlength]="maxPassword + 1"
        autocomplete="current-password"
      />
      <button type="button" class="ojo" (click)="mostrar = !mostrar">
        {{ mostrar ? 'Ocultar' : 'Ver' }}
      </button>
    </div>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="entrar" [disabled]="cargando()">
      {{ cargando() ? 'Verificando…' : 'Entrar' }}
    </button>
  </form>
</div>
