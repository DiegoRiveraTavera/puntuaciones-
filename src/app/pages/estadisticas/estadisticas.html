<app-navbar></app-navbar>

<div class="container">

  <div class="card-header">
    <h1>ESTADÍSTICAS</h1>
    <p class="subtitulo">Resumen visual del desempeño de todas las escuadras.</p>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <span class="stat-num">{{ puntos.length }}</span>
      <span class="stat-label">Escuadras</span>
    </div>
    <div class="stat-box">
      <span class="stat-num">{{ totalGeneral }}</span>
      <span class="stat-label">Puntos totales</span>
    </div>
    <div class="stat-box">
      <span class="stat-num">{{ promedio }}</span>
      <span class="stat-label">Promedio</span>
    </div>
    <div class="stat-box lider">
      <span class="stat-num">{{ lider.nombre }}</span>
      <span class="stat-label">Líder actual</span>
    </div>
  </div>

  <div class="card-body">
    <h3>Puntos totales por escuadra</h3>
    <div class="grafica">
      <div class="barra-col" *ngFor="let e of puntos; let i = index">
        <div class="barra-valor">{{ e.total }}</div>
        <div class="barra" [style.height.px]="getAltura(e.total)" [style.background]="getColor(i)"></div>
        <div class="barra-nombre">{{ e.nombre }}</div>
      </div>
    </div>
  </div>

</div>

<app-futter></app-futter>
