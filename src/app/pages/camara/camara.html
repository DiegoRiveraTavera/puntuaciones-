<div class="camara-container">
  <h2>Permiso de cámara</h2>

  <p>
    Esta función comprobará si puedes acceder a la cámara de tu dispositivo.
  </p>

  <button type="button" (click)="solicitarPermiso()">
    Solicitar permiso de cámara
  </button>

  <p
    class="mensaje"
    [class.correcto]="estado === 'correcto'"
    [class.error]="estado === 'error'"
    role="status"
    aria-live="polite"
  >
    {{ mensaje }}
  </p>

  @if (foto) {
    <img class="foto" [src]="foto" alt="Foto tomada con la cámara" />
  }
</div>

<div class="camara-container">
  <h2>Enlace de sesión</h2>

  <p>Cada enlace se usa una sola vez; al volver a esta página se genera uno nuevo.</p>

  <p class="enlace">{{ enlace }}</p>

  <a class="boton" [routerLink]="['/sesion', codigoEnlace]">Abrir enlace</a>
  <button type="button" (click)="copiarEnlace()">Copiar</button>

  <p class="mensaje" role="status" aria-live="polite">{{ avisoEnlace }}</p>
</div>
