<nav class="navbar">
<img src="/img/moriah.jpg" alt="Logo" class="nav-logo-img" />
  <div class="nav-tabs">
    <button
      *ngFor="let tab of tabs"
      class="nav-tab"
      [class.active]="activeTab === tab.label"
      (click)="setActive(tab)">
      {{ tab.label }}
    </button>
  </div>

  <!-- BUSCADOR -->
  <div class="search-wrapper" [class.open]="searchOpen">
    <input
      *ngIf="searchOpen"
      type="text"
      class="search-input"
      placeholder="Buscar..."
      [(ngModel)]="searchQuery"
      (input)="onSearch()"
      (keydown.escape)="closeSearch()"
      #searchInput
    />
    <button class="search-btn" (click)="toggleSearch()">🔍</button>

    <!-- Resultados -->
    <div class="search-results" *ngIf="searchOpen && results().length > 0">
      <div
        class="search-item"
        *ngFor="let r of results()"
        (click)="goTo(r)">
        <span class="result-type">{{ r.type }}</span>
        <span class="result-title">{{ r.title }}</span>
        <span class="result-desc">{{ r.description }}</span>
      </div>
    </div>

    <!-- Buscando -->
    <div class="search-results" *ngIf="searchOpen && estado() === 'buscando' && results().length === 0">
      <div class="search-empty">Buscando…</div>
    </div>

    <!-- Sin resultados (solo cuando el servidor respondió bien y no hubo coincidencias) -->
    <div class="search-results" *ngIf="searchOpen && estado() === 'listo' && results().length === 0">
      <div class="search-empty">Sin resultados para "{{ searchQuery }}"</div>
    </div>

    <!-- Error del servidor (REQ-17) -->
    <div class="search-results" *ngIf="searchOpen && estado() === 'error'" role="alert">
      <div class="search-empty search-error">No se pudo buscar. Revisa tu conexión e inténtalo de nuevo.</div>
    </div>
  </div>

<!--  <button class="nav-more">+ −</button> -->
 <!-- <button class="nav-login" routerLink="/login">Login</button>-->
</nav>
